; M5OpurSan — M5Cardputer / M5Cardputer ADV 実機ビルド
;
;   pio run              ビルド
;   pio run -t upload    実機へ書き込み
;
; PC 側のビルドはこれとは完全に独立している（opur_editor/Makefile を参照）。
; 分担:
;   PC 実機共通  editor.c / candidate_bar.c / conv_utf8.c / utf8_utf16.c / opur_dict.c
;   PC のみ      view_curses.c（ncurses）
;   実機のみ     m5curses.cpp（M5GFX）
; どちらのビルドも相手側のファイルには触れない。

[env:m5stack-cardputer]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000

build_flags =
  -DESP32S3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -Iopur_editor

; src/ に加えて opur_editor/ の実機側ファイルだけを拾う。
; opur_editor/ を丸ごと入れると PC 専用の view_curses.c まで来てしまうので、
; 実機で使うものを明示的に列挙する。
build_src_filter =
  +<*>
  +<../opur_editor/m5curses.cpp>

; M5GFX / M5Unified は M5Cardputer の依存として入るが、
; 直接 include するので明示しておく。
lib_deps =
  M5Cardputer=https://github.com/m5stack/M5Cardputer
  M5Unified
  M5GFX
