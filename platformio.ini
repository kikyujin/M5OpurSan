; M5OpurSan — M5Cardputer / M5Cardputer ADV 実機ビルド
;
;   pio run              ビルド
;   pio run -t upload    実機へ書き込み
;
; PC 側のビルドはこれとは完全に独立している（opur_editor/Makefile を参照）。
; 分担:
;   PC 実機共通  editor.c / candidate_bar.c / conv_utf8.c / utf8_utf16.c /
;                opur_dict.c / fep/*.cpp
;   PC のみ      view_curses.c（ncurses）/ opur_editor/main.cpp
;   実機のみ     m5curses.cpp（M5GFX）/ view_m5.c / src/main.cpp
; どちらのビルドも相手側のファイルには触れない。

[env:m5stack-cardputer]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000

build_flags =
  -DESP32S3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DM5OPUR                ; 辞書パスを SD 側に切り替える
  -Iopur_editor
  -Idict_tools
  -Ifep

; src/ 以外のディレクトリからは、実機で使うファイルだけを名指しで拾う。
; opur_editor/ を丸ごと入れると PC 専用の view_curses.c（ncurses 依存）と
; main.cpp（もう一つの setup/loop）まで来てしまう。
;
; src/hello_m5.cpp は Phase E-1a のキー疎通確認ツール。
; setup/loop が二重定義になるので通常は外してある。
; 使うときは main.cpp と入れ替える（+<hello_m5.cpp> -<main.cpp>）。
; src/wifi_probe.cpp は WiFi 切り分け用の最小スケッチ。
; 使うときは main.cpp と入れ替える（+<wifi_probe.cpp> -<main.cpp>）。
build_src_filter =
  +<main.cpp>
  -<wifi_probe.cpp>
  -<hello_m5.cpp>
  +<../opur_editor/editor.c>
  +<../opur_editor/candidate_bar.c>
  +<../opur_editor/conv_utf8.c>
  +<../opur_editor/utf8_utf16.c>
  +<../opur_editor/view_m5.c>
  +<../opur_editor/m5curses.cpp>
  +<../opur_editor/opur_config.c>
  +<../opur_editor/opur_log.c>
  +<../opur_editor/opur_wifi.cpp>
  +<../dict_tools/opur_dict.c>
  +<../fep/fep.cpp>
  +<../fep/fep_util.cpp>
  +<../fep/roma_table.cpp>
  +<../fep/convert.cpp>

; M5GFX / M5Unified は M5Cardputer の依存として入るが、
; 直接 include するので明示しておく。SD / SPI は framework 同梱。
lib_deps =
  M5Cardputer=https://github.com/m5stack/M5Cardputer
  M5Unified
  M5GFX
